<!DOCTYPE html>
<html>

<head>

    <title>Smart Navigation Map</title>

    <meta charset="utf-8"/>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <!-- 🌍 LEAFLET -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- 🚗 ROUTING -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css"/>

    <script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>

    <style>

        html, body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            font-family: Arial;
        }

        #map {

            width: 100%;
            height: 100%;
        }

        /* 🔍 SEARCH */

        #searchBox {

            position: absolute;

            top: 15px;
            left: 70px;

            z-index: 1000;

            width: 430px;

            background: white;

            border-radius: 18px;

            overflow: hidden;

            box-shadow:
                0 3px 14px rgba(0,0,0,0.25);
        }

        #searchTop {

            display: flex;
        }

        #searchInput {

            flex: 1;

            border: none;

            outline: none;

            padding: 15px;

            font-size: 15px;
        }

        #searchBtn {

            border: none;

            background: #1A73E8;

            color: white;

            padding: 0 22px;

            cursor: pointer;

            font-weight: bold;
        }

        /* 🔍 SEARCH RESULTS */

        #suggestions {

            max-height: 300px;

            overflow-y: auto;

            background: white;
        }

        .suggestion-item {

            padding: 13px;

            cursor: pointer;

            border-top:
                1px solid #eee;

            font-size: 14px;
        }

        .suggestion-item:hover {

            background: #f2f2f2;
        }

        /* 🚗 INFO CARD */

        #infoCard {

            position: absolute;

            bottom: 20px;

            left: 20px;

            z-index: 1000;

            background: white;

            border-radius: 18px;

            padding: 18px;

            width: 270px;

            box-shadow:
                0 3px 14px rgba(0,0,0,0.25);
        }

        #infoCard h3 {

            margin: 0 0 12px 0;
        }

        #infoCard p {

            margin: 6px 0;

            font-size: 14px;
        }

    </style>

</head>

<body>

<!-- 🔍 SEARCH -->

<div id="searchBox">

    <div id="searchTop">

        <input
                type="text"
                id="searchInput"
                placeholder="Search destination..."
                oninput="searchSuggestions()"
        >

        <button
                id="searchBtn"
                onclick="searchDestination()">

            GO

        </button>

    </div>

    <div id="suggestions"></div>

</div>

<!-- 🚗 INFO -->

<div id="infoCard">

    <h3>🚗 Navigation</h3>

    <p id="distanceText">
        Distance: --
    </p>

    <p id="timeText">
        ETA: --
    </p>

    <p id="locationText">
        Location: Live
    </p>

</div>

<!-- 🗺️ MAP -->

<div id="map"></div>

<script>

    // =========================================
    // 🚀 START LOCATION
    // =========================================

    var currentLat = 17.6685;
    var currentLon = 74.0403;

    // =========================================
    // 🗺️ MAP
    // =========================================

    var map = L.map(
        'map',
        {
            zoomControl: true
        }
    ).setView(
        [currentLat, currentLon],
        15
    );

    // =========================================
    // 🌍 BETTER MAP TILES
    // =========================================

    L.tileLayer(
        'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
            attribution:
                '&copy; OpenStreetMap',
            maxZoom: 19
        }
    ).addTo(map);

    // =========================================
    // 🚗 CAR ICON
    // =========================================

    var carIcon = L.icon({

        iconUrl:
            'https://cdn-icons-png.flaticon.com/512/744/744465.png',

        iconSize: [42, 42],

        iconAnchor: [21, 21]
    });

    // =========================================
    // 🚗 LIVE CAR
    // =========================================

    var marker = L.marker(
        [currentLat, currentLon],
        {
            icon: carIcon
        }
    ).addTo(map);

    // =========================================
    // 🚗 ROUTING
    // =========================================

    var routingControl = L.Routing.control({

        waypoints: [],

        routeWhileDragging: false,

        draggableWaypoints: false,

        addWaypoints: false,

        fitSelectedRoutes: true,

        showAlternatives: false,

        show: false,

        createMarker: function() {
            return null;
        },

        lineOptions: {

            styles: [

                {
                    color: '#1565C0',
                    opacity: 0.95,
                    weight: 9
                },

                {
                    color: '#42A5F5',
                    opacity: 0.7,
                    weight: 5
                }
            ]
        }

    }).addTo(map);

    // =========================================
    // 🚗 ROUTE INFO
    // =========================================

    routingControl.on(
        'routesfound',
        function(e) {

            var route =
                e.routes[0];

            var distance =
                (
                    route.summary.totalDistance
                    / 1000
                ).toFixed(2);

            var time =
                (
                    route.summary.totalTime
                    / 60
                ).toFixed(0);

            document.getElementById(
                "distanceText"
            ).innerHTML =
                "Distance: " +
                distance +
                " km";

            document.getElementById(
                "timeText"
            ).innerHTML =
                "ETA: " +
                time +
                " mins";
        }
    );

    // =========================================
    // 📡 LIVE GPS UPDATE
    // =========================================

    function updateLocation(lat, lon) {

        currentLat = lat;
        currentLon = lon;

        // 🚗 MOVE CAR ONLY

        marker.setLatLng([lat, lon]);

        // 📍 UPDATE INFO

        document.getElementById(
            "locationText"
        ).innerHTML =
            "Location: " +
            lat.toFixed(5) +
            ", " +
            lon.toFixed(5);
    }

    // =========================================
    // 🔍 FAST SEARCH
    // =========================================

    async function searchSuggestions() {

        var query =
            document.getElementById(
                "searchInput"
            ).value;

        if (query.length < 2) {

            document.getElementById(
                "suggestions"
            ).innerHTML = "";

            return;
        }

        try {

            var url =
                "https://photon.komoot.io/api/?q="
                + encodeURIComponent(query);

            var response =
                await fetch(url);

            var data =
                await response.json();

            let html = "";

            data.features
                .slice(0, 5)
                .forEach(place => {

                    let name =
                        place.properties.name || "";

                    let city =
                        place.properties.city || "";

                    let country =
                        place.properties.country || "";

                    let full =
                        name + ", " +
                        city + ", " +
                        country;

                    let lat =
                        place.geometry.coordinates[1];

                    let lon =
                        place.geometry.coordinates[0];

                    html += `

                        <div class="suggestion-item"
                             onclick="selectPlace(
                                '${full.replace(/'/g, "")}',
                                ${lat},
                                ${lon}
                             )">

                            ${full}

                        </div>
                    `;
                });

            document.getElementById(
                "suggestions"
            ).innerHTML = html;

        } catch(e) {

            console.log(e);
        }
    }

    // =========================================
    // 📍 SELECT PLACE
    // =========================================

    function selectPlace(name, lat, lon) {

        document.getElementById(
            "searchInput"
        ).value = name;

        document.getElementById(
            "suggestions"
        ).innerHTML = "";

        routingControl.setWaypoints([

            L.latLng(currentLat, currentLon),

            L.latLng(lat, lon)

        ]);

        map.flyTo(
            [lat, lon],
            15,
            {
                animate: true,
                duration: 1.5
            }
        );
    }

    // =========================================
    // 🔍 ENTER SEARCH
    // =========================================

    document
        .getElementById(
            "searchInput"
        )
        .addEventListener(
            "keypress",
            function(event) {

                if (event.key === "Enter") {

                    searchDestination();
                }
            }
        );

    // =========================================
    // 🔍 SEARCH BUTTON
    // =========================================

    async function searchDestination() {

        var place =
            document.getElementById(
                "searchInput"
            ).value;

        if (!place) return;

        try {

            var url =
                "https://photon.komoot.io/api/?q="
                + encodeURIComponent(place);

            var response =
                await fetch(url);

            var data =
                await response.json();

            if (
                !data.features ||
                data.features.length === 0
            ) {

                alert("Place not found");

                return;
            }

            var result =
                data.features[0];

            var lat =
                result.geometry.coordinates[1];

            var lon =
                result.geometry.coordinates[0];

            selectPlace(
                place,
                lat,
                lon
            );

        } catch(e) {

            console.log(e);
        }
    }

</script>

</body>

</html>
